<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="¡HOLA! - welcome to my terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>¡HOLA!</title>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="896" height="216" rx="14" fill="#0a0a0a"/>
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#scan)"/>
  <rect x="2" y="2" width="896" height="216" rx="14" fill="none" stroke="#8ec07c" stroke-width="2" filter="url(#soft)">
    <animate attributeName="stroke" values="#d3869b;#fe8019;#fabd2f;#8ec07c;#83a598;#d3869b" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- window dots -->
  <circle cx="30" cy="28" r="6" fill="#fb4934"/>
  <circle cx="52" cy="28" r="6" fill="#fabd2f"/>
  <circle cx="74" cy="28" r="6" fill="#8ec07c"/>

  <!-- prompt -->
  <text x="30" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#8ec07c">
    shashank@dev:~$ ./hola
    <animate attributeName="fill" values="#8ec07c;#83a598;#8ec07c" dur="6s" repeatCount="indefinite"/>
  </text>
  <rect x="270" y="57" width="10" height="20" fill="#8ec07c">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <!-- glowing title -->
  <text x="450" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="84" font-weight="700" letter-spacing="14" fill="#d3869b" filter="url(#glow)">
    ¡HOLA!
    <animate attributeName="fill" values="#d3869b;#fe8019;#fabd2f;#8ec07c;#83a598;#d3869b" dur="10s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="190" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="3" fill="#b16286" filter="url(#soft)">
    ~ welcome to my terminal ~
    <animate attributeName="fill" values="#b16286;#d3869b;#83a598;#b16286" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
