<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="900" height="16" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ec07c"><animate attributeName="stop-color" values="#8ec07c;#83a598;#d3869b;#fe8019;#8ec07c" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#b16286"><animate attributeName="stop-color" values="#b16286;#fabd2f;#8ec07c;#83a598;#b16286" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#83a598"><animate attributeName="stop-color" values="#83a598;#8ec07c;#fabd2f;#d3869b;#83a598" dur="8s" repeatCount="indefinite"/></stop>
