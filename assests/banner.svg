<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="SHASHANK - B.Tech CSE Cyber Security - Surfing the wave of the new tech sea" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SHASHANK</title>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="896" height="256" rx="14" fill="#0a0a0a"/>
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#scan)"/>
  <rect x="2" y="2" width="896" height="256" rx="14" fill="none" stroke="#8ec07c" stroke-width="2" filter="url(#soft)">
    <animate attributeName="stroke" values="#8ec07c;#83a598;#d3869b;#fe8019;#fabd2f;#8ec07c" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- window dots -->
  <circle cx="30" cy="28" r="6" fill="#fb4934"/>
  <circle cx="52" cy="28" r="6" fill="#fabd2f"/>
  <circle cx="74" cy="28" r="6" fill="#8ec07c"/>

  <!-- prompt -->
  <text x="30" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#8ec07c">
    shashank@dev:~$ ./whoami
    <animate attributeName="fill" values="#8ec07c;#83a598;#8ec07c" dur="6s" repeatCount="indefinite"/>
  </text>
  <rect x="292" y="57" width="10" height="20" fill="#8ec07c">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <!-- glowing name -->
  <text x="450" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" letter-spacing="10" fill="#8ec07c" filter="url(#glow)">
    SHASHANK
    <animate attributeName="fill" values="#8ec07c;#83a598;#d3869b;#fe8019;#fabd2f;#8ec07c" dur="10s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="200" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" letter-spacing="3" fill="#c0c0c0" filter="url(#soft)">B.Tech CSE — Cyber Security</text>
  <text x="450" y="232" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#b16286" filter="url(#soft)">
    ~ Surfing the wave of the new tech sea ~
    <animate attributeName="fill" values="#b16286;#d3869b;#83a598;#b16286" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
